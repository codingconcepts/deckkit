# What a push has to survive.
#
# The interesting step is the last two. The unit tests cover the arithmetic,
# but the examples are the only thing that imports the whole public surface -
# a renamed export, a module that stopped exporting what index.js re-exports,
# or a component whose options changed shape fails there and nowhere else.
# They are the integration test; they just happen to also be the docs.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    strategy:
      # Both versions run even when one fails: "broken on 24, fine on 22" is
      # the useful result, and fail-fast throws it away.
      fail-fast: false
      matrix:
        # 22 is the floor: `node --test` only takes glob patterns from 22,
        # and vite.config.js uses import.meta.dirname.
        node: ["22", "24"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Unit tests
        run: npm test

      # Not a lint. The validator is what makes "validated palette" a fact
      # rather than a habit, so a ramp edited into failing has to break the
      # build the same way a failing test does.
      - name: Palette validator
        run: npm run palette

      - name: Library build
        run: npm run build

      - name: Example decks build
        run: |
          npx vite build --config examples/sizing/vite.config.js
          npx vite build --config examples/gallery/vite.config.js
